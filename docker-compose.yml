# Development infrastructure for Quick Commerce Pulse.
# Usage: docker compose up -d   (Postgres on 5432, Redis on 6379)

services:
  postgres:
    image: postgres:16-alpine
    container_name: qcp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qcp
      POSTGRES_PASSWORD: qcp_dev_password
      POSTGRES_DB: qcp
    ports:
      - "5432:5432"
    volumes:
      - qcp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qcp -d qcp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: qcp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - qcp_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qcp_pgdata:
  qcp_redisdata:
