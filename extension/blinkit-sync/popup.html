<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="popup">
  <h1>QCP Blinkit Sync</h1>

  <section>
    <div id="appStatus" class="muted">Checking QCP login…</div>
    <div id="blinkitStatus" class="muted"></div>
  </section>

  <section>
    <label>Brand
      <select id="brand"><option value="">— select —</option></select>
    </label>
    <label class="row"><input type="checkbox" id="capture" /> Auto-upload Blinkit downloads</label>
  </section>

  <section>
    <button id="runAll">Run all reports</button>
    <div id="runInfo" class="muted"></div>
  </section>

  <section id="pendingWrap" hidden>
    <h2>Pending</h2>
    <ul id="pending"></ul>
  </section>

  <section>
    <h2>Activity</h2>
    <ul id="log" class="log"></ul>
  </section>

  <a href="options.html" target="_blank">Settings</a>
  <script type="module" src="popup.js"></script>
</body>
</html>
